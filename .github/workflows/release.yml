name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching the app marketing version
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    name: Build unsigned release
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Import self-signed identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.DISPLAYCOVE_SIGNING_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DISPLAYCOVE_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/DisplayCovePreview.p12"
          certificate_pem="$RUNNER_TEMP/DisplayCovePreview.pem"
          keychain_path="$RUNNER_TEMP/DisplayCovePreview.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security find-certificate -c "DisplayCove Preview Signing" -p "$keychain_path" > "$certificate_pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$certificate_pem"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"

          echo "DISPLAYCOVE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed artifacts
        env:
          DISPLAYCOVE_SIGNING_IDENTITY: DisplayCove Preview Signing
          DISPLAYCOVE_RELEASE_TAG: ${{ inputs.tag }}
          TMPDIR: ${{ runner.temp }}
        run: Scripts/build-unsigned-release.sh

      - name: Generate signed Sparkle appcast
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          app_info="$RUNNER_TEMP/DisplayCove-Unsigned-Release-DerivedData/Build/Products/Release/DisplayCove.app/Contents/Info.plist"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_info")"
          if [[ "$version" != "$app_version" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $app_version" >&2
            exit 1
          fi

          dist="$GITHUB_WORKSPACE/dist/$RELEASE_TAG"
          work="$RUNNER_TEMP/appcast"
          key_file="$RUNNER_TEMP/sparkle-private-key"
          mkdir -p "$work"
          cp "$dist"/*.zip "$work/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          generate_appcast="$(find "$RUNNER_TEMP" -path '*/Sparkle/bin/generate_appcast' -type f -print -quit)"
          "$generate_appcast" \
            --ed-key-file "$key_file" \
            --download-url-prefix "https://github.com/MJuma/DisplayCove/releases/download/$RELEASE_TAG/" \
            --link "https://github.com/MJuma/DisplayCove" \
            --embed-release-notes \
            "$work"
          cp "$work/appcast.xml" "$dist/appcast.xml"

      - name: Verify artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist/$RELEASE_TAG"
          verify="$RUNNER_TEMP/verify"
          mkdir -p "$verify"
          (
            cd "$dist"
            shasum -a 256 -c SHA256SUMS.txt
          )
          hdiutil verify "$dist"/*.dmg
          ditto -x -k "$dist"/*.zip "$verify"
          codesign --verify --deep --strict "$verify/DisplayCove.app"
          xmllint --noout "$dist/appcast.xml"

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist/$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          ## Unsigned release

          DisplayCove $version is self-signed and is not notarized by Apple. macOS blocks the first launch by default.

          1. Drag **DisplayCove.app** to Applications.
          2. Try to open DisplayCove once.
          3. Open **System Settings → Privacy & Security**.
          4. Choose **Open Anyway** for DisplayCove and confirm.
          5. Grant **Screen & System Audio Recording** access when requested.

          Only override Gatekeeper for artifacts downloaded from this release page.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$dist"/*.dmg \
              "$dist"/*.zip \
              "$dist/SHA256SUMS.txt" \
              "$dist/appcast.xml" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "DisplayCove $version" \
              --notes-file "$notes" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "$dist"/*.dmg \
              "$dist"/*.zip \
              "$dist/SHA256SUMS.txt" \
              "$dist/appcast.xml" \
              --title "DisplayCove $version" \
              --notes-file "$notes" \
              --latest
          fi
