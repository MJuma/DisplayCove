name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, and lint
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test -Xswiftc -warnings-as-errors -Xcc -Werror

      - name: Release and runner safety tests
        run: bash Scripts/test-tooling.sh

      - name: Build app
        run: >
          xcodebuild -quiet
          -project DisplayCove.xcodeproj
          -scheme DisplayCove
          -configuration Debug
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          GCC_TREAT_WARNINGS_AS_ERRORS=YES
          build

      - name: Check formatting
        run: >
          swift run --package-path BuildTools
          swiftformat --lint .
          --swiftversion 6
