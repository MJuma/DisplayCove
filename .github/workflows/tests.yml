name: Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build, test, and lint
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Build app
        run: >
          xcodebuild -quiet
          -project DisplayCove.xcodeproj
          -scheme DisplayCove
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Check formatting
        run: >
          swift run --package-path BuildTools
          swiftformat --lint .
          --swiftversion 6
